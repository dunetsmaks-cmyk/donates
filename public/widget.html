<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OBS Widget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="donation-container" class="hidden">
        <img id="don-image" src="" alt="donation image">
        <div class="text-block">
            <div id="don-header"><span id="don-name"></span> <span id="don-amount" class="highlight"></span></div>
            <div id="don-message"></div>
        </div>
    </div>

    <audio id="don-sound" src="sound.mp3"></audio> <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const queue = [];
        let isPlaying = false;

        const container = document.getElementById('donation-container');
        const img = document.getElementById('don-image');
        const nameEl = document.getElementById('don-name');
        const amountEl = document.getElementById('don-amount');
        const messageEl = document.getElementById('don-message');
        const sound = document.getElementById('don-sound');

        socket.on('new_donation', (data) => {
            queue.push(data);
            processQueue();
        });

        function processQueue() {
            if (isPlaying || queue.length === 0) return;
            isPlaying = true;

            const data = queue.shift();
            
            // Заполняем данные
            img.src = data.image;
            nameEl.innerText = data.username;
            amountEl.innerText = `${data.amount} ${data.currency}`;
            messageEl.innerText = data.message;

            // Показываем виджет и играем звук
            container.classList.remove('hidden');
            container.classList.add('slide-in');
            
            // Звук может блокироваться браузером без взаимодействия, но в OBS обычно работает
            sound.currentTime = 0;
            sound.play().catch(e => console.log("Audio play prevented by browser rules"));

            // Убираем виджет через 8 секунд
            setTimeout(() => {
                container.classList.remove('slide-in');
                container.classList.add('hidden');
                
                // Ждем окончания анимации скрытия перед следующим донатом
                setTimeout(() => {
                    isPlaying = false;
                    processQueue();
                }, 500); 
            }, 8000);
        }
    </script>
</body>
</html>
