<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отправка фейк доната</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light p-4">
    <div class="container" style="max-width: 500px;">
        <h2 class="mb-4 text-warning">Панель управления донатами</h2>
        <div class="mb-3">
            <label class="form-label">Никнейм:</label>
            <input type="text" id="username" class="form-control" value="Аноним" placeholder="Кто донатит?">
        </div>
        <div class="mb-3 flex">
            <label class="form-label">Сумма и Валюта:</label>
            <div class="input-group">
                <input type="number" id="amount" class="form-control" value="500">
                <input type="text" id="currency" class="form-control" value="RUB" style="max-width: 80px;">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Сообщение:</label>
            <textarea id="message" class="form-control" rows="3" placeholder="Текст доната..."></textarea>
        </div>
        <div class="mb-4">
            <label class="form-label">URL картинки/GIF (необязательно):</label>
            <input type="text" id="image_url" class="form-control" placeholder="https://ссылка-на-гифку.gif">
        </div>
        <button onclick="sendDonation()" class="btn btn-warning w-100 fw-bold fs-5">Отправить Донат!</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function sendDonation() {
            const data = {
                username: document.getElementById('username').value || 'Аноним',
                amount: document.getElementById('amount').value || '0',
                currency: document.getElementById('currency').value || 'RUB',
                message: document.getElementById('message').value || '',
                image: document.getElementById('image_url').value || 'https://media.giphy.com/media/L0qTl8hl84EDly62J1/giphy.gif' // Дефолтная гифка
            };
            
            socket.emit('send_donation', data);
            document.getElementById('message').value = ''; // Очищаем поле сообщения после отправки
        }
    </script>
</body>
</html>
